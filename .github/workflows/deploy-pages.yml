# 화면에 필요한 파일 3개만 GitHub Pages에 올린다. API 키를 쓰지 않으므로 Secrets 설정이 필요 없다.
name: Deploy dashboard

# 저장소를 공개로 바꿨으므로(2026-11-04) 화면 파일이 바뀌어 main에 올라오면 자동으로 배포한다.
# Actions 탭에서 'Run workflow'로 직접 실행할 수도 있다.
on:
  push:
    branches: [main]
    paths:
      - "dashboard/index.html"
      - "dashboard/data.js"
      - "dashboard/reviews.js"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          # 사이트 첫 화면과 /dashboard/ 주소 둘 다에서 대시보드가 열리게 한다
          mkdir -p _site/dashboard
          cp dashboard/index.html dashboard/data.js dashboard/reviews.js _site/
          cp dashboard/index.html dashboard/data.js dashboard/reviews.js _site/dashboard/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
