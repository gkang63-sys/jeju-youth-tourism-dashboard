# 화면에 필요한 파일 3개만 GitHub Pages에 올린다. API 키를 쓰지 않으므로 Secrets 설정이 필요 없다.
name: Deploy dashboard

# 비공개 저장소에서는 Pages를 쓸 수 없으므로 푸시할 때 자동으로 돌지 않게 했다.
# 공개 조건을 확인한 뒤 Actions 탭에서 'Run workflow'로 직접 실행한다.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp dashboard/index.html dashboard/data.js dashboard/reviews.js _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
